name: Publicar Leitor de Voz (GitHub Pages)

on:
  push:
    branches: [main, claude/pdf-voice-reader-app-tt5jn1]
    paths: ['leitor-voz/**', '.github/workflows/leitor-voz-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: leitor-voz
      - id: deployment
        uses: actions/deploy-pages@v4
